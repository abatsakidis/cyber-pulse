name: Update Cyber Pulse
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect RSS feeds
        run: python scripts/fetch_news.py
      - name: Generate intelligence brief
        run: python scripts/ai_brief.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json data/status.json data/ai.json
          git diff --cached --quiet || git commit -m 'chore: update cyber news'
          git push
